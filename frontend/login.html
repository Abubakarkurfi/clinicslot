<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Registration - ClinicSlot</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Cloudflare Turnstile script -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="index.html" class="brand">
        <span class="brand-icon">🏥</span> ClinicSlot
      </a>
      <ul class="nav-links" id="main-nav"></ul>
    </div>
  </header>

  <main class="container" style="max-width: 520px;">
    <div class="card">
      <div style="display: flex; border-bottom: 2px solid var(--border); margin-bottom: 1.5rem;">
        <button id="tab-login" class="btn" style="flex: 1; border-radius: 0; border-bottom: 2px solid var(--primary); font-weight: 700; color: var(--primary);">Sign In</button>
        <button id="tab-register" class="btn btn-outline" style="flex: 1; border: none; border-radius: 0; color: var(--text-muted);">Register Patient</button>
      </div>

      <div id="auth-alert"></div>

      <!-- Sign In Form -->
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-control" required placeholder="e.g. patient@clinicslot.com">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="form-control" required placeholder="••••••••••">
        </div>
        <button type="submit" id="btn-login-submit" class="btn btn-primary btn-block">Sign In</button>

        <div style="margin-top: 1rem; font-size: 0.8rem; color: var(--text-muted); background: #f8fafc; padding: 0.75rem; border-radius: var(--radius);">
          <strong>Demo Credentials:</strong><br>
          • <strong>Patient:</strong> patient@clinicslot.com / Password123!<br>
          • <strong>Receptionist:</strong> reception@clinicslot.com / Password123!<br>
          • <strong>Admin:</strong> admin@clinicslot.com / Password123!
        </div>
      </form>

      <!-- Register Patient Form -->
      <form id="register-form" style="display: none;">
        <div class="form-group">
          <label for="reg-name">Full Name</label>
          <input type="text" id="reg-name" class="form-control" required placeholder="e.g. Mariam Soliman">
        </div>
        <div class="form-group">
          <label for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="form-control" required placeholder="mariam@example.com">
        </div>
        <div class="form-group">
          <label for="reg-phone">Phone Number</label>
          <input type="tel" id="reg-phone" class="form-control" required placeholder="+20 10 1234 5678">
        </div>
        <div class="form-group">
          <label for="reg-password">Password (Minimum 10 characters)</label>
          <input type="password" id="reg-password" class="form-control" minlength="10" required placeholder="••••••••••">
        </div>

        <!-- Cloudflare Turnstile Widget (Bot Prevention) -->
        <div class="form-group" style="display: flex; justify-content: center; margin: 1rem 0;">
          <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA" data-callback="onTurnstileSuccess"></div>
        </div>
        <input type="hidden" id="reg-turnstile-token" value="1x00000000000000000000AA">

        <button type="submit" id="btn-reg-submit" class="btn btn-primary btn-block">Create Patient Account</button>
      </form>
    </div>
  </main>

  <footer>
    <p>ClinicSlot &copy; 2026. Secure Cloud Authentication with JWT & Turnstile.</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login-page.js"></script>
</body>
</html>
