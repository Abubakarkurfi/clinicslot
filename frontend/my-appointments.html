<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Appointments - ClinicSlot</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="index.html" class="brand">
        <span class="brand-icon">🏥</span> ClinicSlot
      </a>
      <ul class="nav-links" id="main-nav"></ul>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <div class="card-header">
        <h1 class="card-title">My Appointments</h1>
        <a href="book.html" class="btn btn-primary btn-sm">+ Book New</a>
      </div>

      <div id="appointments-alert"></div>

      <div class="table-container">
        <table id="appointments-table">
          <thead>
            <tr>
              <th>Date & Time</th>
              <th>Doctor</th>
              <th>Specialty / Room</th>
              <th>Status</th>
              <th>Reason</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="appointments-tbody">
            <tr>
              <td colspan="6" style="text-align: center; color: var(--text-muted);">Loading your bookings...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Reschedule Modal -->
  <div id="reschedule-modal" class="modal-overlay">
    <div class="modal-content">
      <h3 style="margin-bottom: 1rem;">Reschedule Appointment</h3>
      <div id="modal-alert"></div>
      
      <div class="form-group">
        <label for="reschedule-date">Select New Date</label>
        <input type="date" id="reschedule-date" class="form-control">
      </div>

      <div class="form-group">
        <label>Available Slots</label>
        <div id="modal-slots" class="slots-container"></div>
        <input type="hidden" id="modal-new-slot">
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
        <button type="button" id="btn-close-modal" class="btn btn-outline">Cancel</button>
        <button type="button" id="btn-save-reschedule" class="btn btn-primary" disabled>Confirm Reschedule</button>
      </div>
    </div>
  </div>

  <footer>
    <p>ClinicSlot &copy; 2026. Self-Service Patient Portal.</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/my-appointments-page.js"></script>
</body>
</html>
